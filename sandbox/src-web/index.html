<!doctype html>
<html lang="en">
<head>
    <title>sandbox</title>
    <meta charset="UTF-8">
<style>
    .big {
        width: 640px;
        height: 640px;

        font-size: 4em;
    }
    
    .tab-panel {
        background-color: #1e1e1e;
        height: 100%;
        width: 100%;
        display: none;
    }

    .tab-selected {
        display: grid;
        width: 100%;
        height: 100%;
        grid-template-rows: auto 2.0em;
        grid-row-gap: 10px;
        grid-column-gap: 10px;
    }

    textarea {
        box-sizing: border-box; /* パディングを要素の幅と高さに含める */
        display: block;
        width: 100%;            /* グリッドの幅いっぱいに広げる */
        padding: 12px 16px;     /* 上下に12px、左右に16pxの余白を設定 */
        overflow: auto;         /* 文字がはみ出た際のスクロールバーを適切に表示 */
        resize: vertical;       /* 縦方向のリサイズのみ許可する */
    }

    .tab-radio {
        display: none;
    }
    label {
        background-color: #1e1e1e;
        color: #fefefe;
    }
    input:checked + label {
        background-color: #fefefe;
        color: #000000;
    }

    .bevy-canvas {
        width: 640px;
        height: 640px;
    }

    .hide-before-start {
        display: none;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, 640px);
    }
    .app {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 640px;
        width: 640px;
    }
    .editor {
        display: grid;
        height: 640px;
        width: 640px;
        grid-template-columns: auto;
        grid-template-rows: 1.2em auto;
    }
    .tabs {
        width: 100%;
        height: 1.2em;
    }
    .wgsl_text {
        width: 100%;
        height: 100%;
    }
    .controller {
        display: grid;
        height: 640px;
        width: 640px;
        grid-template-columns: auto;
        grid-template-rows: 1.2em auto;
    }
    .result_get_status {
        min-height: 1em;
        max-width: 1em;
        background-color: #1e1e1e;
        color: #fefefe;
    }


</style>
</head>

<body style="margin: 0px; background-color: #040404;">
    <script type="module">
    import init, {
        start,
        read_wgsl,
        write_wgsl,
        get_status_js,
        select_mode_js,
        send_command_js
    } from './sandbox.js'

    async function on_load() {
        let wasm = await init().catch((error) => {
            if (!error.message.startsWith("Using exceptions for control flow, don't mind me. This isn't actually an error!")) {
                throw error;
            }
        })

        let btn = document.getElementById('open')
        btn.addEventListener('click', (ev) => {
            btn.remove()
            let canvas = document.getElementById('bevy')
            canvas.classList.remove('hide-before-start')
            open()
        })
        btn.textContent = 'Open'
        btn.disabled = null;
    }

    async function open() {
        start()

        // enable buttons
        // - custom material
        let apply_btn = document.getElementById('custom_material_apply')
        apply_btn.addEventListener('click', (ev) => {
            write_custom_material_wgsl()
        })
        apply_btn.disabled = null;
        let read_btn = document.getElementById('custom_material_read')
        read_btn.addEventListener('click', (ev) => {
            read_custom_material_wgsl()
        })
        read_btn.disabled = null;

        read_custom_material_wgsl()

        // - extended material
        let apply_btn2 = document.getElementById('extended_material_apply')
        apply_btn2.addEventListener('click', (ev) => {
            write_extended_material_wgsl()
        })
        apply_btn2.disabled = null;
        let read_btn2 = document.getElementById('extended_material_read')
        read_btn2.addEventListener('click', (ev) => {
            read_extended_material_wgsl()
        })
        read_btn2.disabled = null;

        read_extended_material_wgsl()

        // enable tabs
        function tab_changed(_ev) {
            let tab_custom_material = document.getElementById('tab_custom_material')
            let tab_extended_material = document.getElementById('tab_extended_material')
            let panel_custom_material = document.querySelector('.panel-custom_material')
            let panel_extended_material = document.querySelector('.panel-extended_material')

            if (tab_custom_material.checked) {
                panel_custom_material.classList.add('tab-selected')
                panel_extended_material.classList.remove('tab-selected')
            } else if (tab_extended_material.checked) {
                panel_custom_material.classList.remove('tab-selected')
                panel_extended_material.classList.add('tab-selected')
            }
        }
        let tab_custom_material = document.getElementById('tab_custom_material')
        tab_custom_material.disabled = null;
        let tab_extended_material = document.getElementById('tab_extended_material')
        tab_extended_material.disabled = null;
        tab_custom_material.addEventListener('change', tab_changed)
        tab_extended_material.addEventListener('change', tab_changed)
        tab_changed()

        // enable controller
        // - get_status
        let btn_get_status = document.getElementById('btn_get_status')
        btn_get_status.addEventListener('click', (ev) => {
            read_app_status()
        })
        btn_get_status.disabled = null;

    }

    function read_custom_material_wgsl() {
        let wasm = read_wgsl('CustomMaterial')
        let textarea = document.getElementById('custom_material_wgsl')
        console.log('read_custom_material_wgsl', wasm)
        textarea.value = wasm
    }

    function write_custom_material_wgsl() {
        let textarea = document.getElementById('custom_material_wgsl')
        let wasm = textarea.value
        write_wgsl('CustomMaterial', wasm)
    }

    function read_extended_material_wgsl() {
        let wasm = read_wgsl('ExtendedMaterial')
        let textarea = document.getElementById('extended_material_wgsl')
        console.log('read_extended_material_wgsl', wasm)
        textarea.value = wasm
    }

    function write_extended_material_wgsl() {
        let textarea = document.getElementById('extended_material_wgsl')
        let wasm = textarea.value
        write_wgsl('ExtendedMaterial', wasm)
    }

    function read_app_status() {
        let status = get_status_js()
        let div = document.getElementById('result_get_status')
        div.textContent = JSON.stringify(status)
    }

    window.addEventListener('load', (e) => {
        on_load()
    })

    </script>

    <div class="container">
        <div class="app">
            <canvas id="bevy" class="bevy-canvas hide-before-start"></canvas>
            <button id="open" type="button" class="big" disabled>Loading...</button>
        </div>
        <div class="editor">
            <div class="tabs">
                <input type="radio" name="tab-radio" id="tab_custom_material" class="tab-radio" value="Custom Material" disabled checked>
                <label for="tab_custom_material">Custom Material</label>
                <input type="radio" name="tab-radio" id="tab_extended_material" class="tab-radio" value="Extended Material" disabled>
                <label for="tab_extended_material">Extended Material</label>
            </div>
            <div class="tab-panel panel-custom_material">
                <textarea id="custom_material_wgsl" class="wgsl_text"></textarea>
                <div class="control-btns">
                    <input type="button" id="custom_material_apply" class="wgsl_btn" value="Apply" disabled>
                    <input type="button" id="custom_material_read" class="wgsl_btn" value="Read" disabled>
                </div>
            </div>
            <div class="tab-panel panel-extended_material">
                <textarea id="extended_material_wgsl" class="wgsl_text"></textarea>
                <div class="control-btns">
                    <input type="button" id="extended_material_apply" class="wgsl_btn" value="Apply" disabled>
                    <input type="button" id="extended_material_read" class="wgsl_btn" value="Read" disabled>
                </div>
            </div>
        </div>
        <div class="controller"> <!-- now testing -->
            <div>
                <div id="result_get_status" class="result_get_status"></div>
                <input type="button" id="btn_get_status" value="Get Status" disabled>
            </div>
        </div>
    </div>
</body>

</html>
